services:
  # 服务1: 用户机器人 (负责从源频道偷消息 -> 发给机器人)
  userbot:
    build: .
    container_name: toujibot_user
    restart: unless-stopped
    volumes:
      - ./:/app
    command: python telegram_bot.py
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    stdin_open: true
    tty: true

  # 服务2: 机器人转发 (负责从私聊接收 -> 广播到最终频道)
  relaybot:
    build: .
    container_name: toujibot_relay
    restart: unless-stopped
    volumes:
      - ./:/app
    command: python bot_relay.py
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env

  # 服务3: 管理机器人（独立 bot token，用于管理 UI / 点选配置）
  # 默认不启动：使用 profile "admin"，需要时运行：
  #   docker compose --profile admin up -d --build
  adminbot:
    profiles: ["admin"]
    build: .
    container_name: toujibot_admin
    restart: unless-stopped
    volumes:
      - ./:/app
    command: python admin_bot.py
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    stdin_open: true
    tty: true
